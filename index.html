<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MTIS — Mixed Tenure Interminable Saga</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: #f3f2f1;
      color: #242124;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    .site-header {
      min-height: 92px;
      background: #542b7a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 6vw;
      border-bottom: 6px solid #3f205c;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .brand-acronym {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0.7px;
    }

    .header-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }

    /* MAIN */

    main {
      flex: 1;
      width: 100%;
    }

    .hero {
      max-width: 1400px;
      margin: 0 auto;
      padding: 90px 6vw 80px;
    }

    .programme-date {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 48px;
    }

    .label {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #5c5860;
    }

    .date {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* CLOCK */

    .clock-section {
      border-top: 1px solid #c9c6ca;
      padding-top: 38px;
    }

    .clock-section h1 {
      margin: 0 0 22px;
      font-size: clamp(28px, 4vw, 58px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -1.5px;
      color: #542b7a;
    }

    .clock {
      margin: 0;
      font-size: clamp(55px, 10vw, 150px);
      line-height: 0.95;
      font-weight: 800;
      letter-spacing: -4px;
      color: #211e22;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .counting {
      margin: 28px 0 0;
      font-size: 21px;
      color: #5c5860;
    }

    /* STATUS */

    .status-box {
      max-width: 1400px;
      margin: 0 auto 80px;
      padding: 28px 6vw;
      border-top: 1px solid #c9c6ca;
      border-bottom: 1px solid #c9c6ca;
      display: flex;
      align-items: baseline;
      gap: 28px;
    }

    .status-heading {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.3px;
      color: #542b7a;
    }

    .status-text {
      font-size: 18px;
      color: #3d393f;
    }

    /* FOOTER */

    .site-footer {
      background: #29262b;
      color: #e8e6e8;
      padding: 30px 6vw;
      font-size: 12px;
      line-height: 1.6;
    }

    .site-footer p {
      margin: 0;
    }

    .site-footer p + p {
      margin-top: 4px;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .site-header {
        min-height: auto;
        padding: 18px 6vw;
        align-items: flex-start;
      }

      .brand {
        gap: 14px;
      }

      .brand-acronym {
        font-size: 32px;
      }

      .brand-name {
        font-size: 10px;
      }

      .header-label {
        display: none;
      }

      .hero {
        padding: 60px 6vw 55px;
      }

      .programme-date {
        margin-bottom: 40px;
      }

      .date {
        font-size: 24px;
      }

      .clock-section {
        padding-top: 30px;
      }

      .clock-section h1 {
        font-size: 31px;
      }

      .clock {
        font-size: clamp(43px, 13vw, 78px);
        letter-spacing: -2px;
        overflow-x: auto;
        padding-bottom: 5px;
      }

      .counting {
        font-size: 18px;
        margin-top: 20px;
      }

      .status-box {
        margin-bottom: 50px;
        padding: 24px 6vw;
        display: block;
      }

      .status-heading {
        margin-bottom: 8px;
      }

      .status-text {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="site-header">

      <div class="brand">

        <div class="brand-acronym">
          MTIS
        </div>

        <div class="brand-name">
          MIXED TENURE<br>
          INTERMINABLE SAGA
        </div>

      </div>

      <div class="header-label">
        TRACKING SERVICE
      </div>

    </header>


    <main>

      <section class="hero">

        <div class="programme-date">

          <span class="label">
            PROGRAMME COMMENCEMENT
          </span>

          <span class="date">
            14 JULY 2023
          </span>

        </div>


        <div class="clock-section">

          <h1>
            HOURS SINCE STARTED
          </h1>

          <div
            class="clock"
            id="mainClock"
            aria-live="polite"
          >
            00,000:00:00
          </div>

          <p class="counting">
            And counting.
          </p>

        </div>

      </section>


      <section class="status-box">

        <div class="status-heading">
          CURRENT STATUS
        </div>

        <div class="status-text">
          Time continues to elapse.
        </div>

      </section>

    </main>


    <footer class="site-footer">

      <p>
        MTIS is an unofficial tracking project.
      </p>

      <p>
        Not affiliated with the City of Edinburgh Council.
      </p>

    </footer>

  </div>


  <script src="events.js"></script>

</body>
</html>
